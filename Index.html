<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --border: #e1e5e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 70px;
    }

    /* Header */
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* Tabs cố định dưới cùng - dễ bấm bằng ngón cái trên mobile */
    nav.tabs {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: #fff;
      border-top: 1px solid var(--border);
      z-index: 30;
    }
    nav.tabs button {
      flex: 1;
      border: none;
      background: none;
      padding: 12px 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    nav.tabs button.active {
      color: var(--accent);
      border-top: 3px solid var(--accent);
    }

    main { padding: 12px; }

    /* Danh sách mã */
    .ma-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .ma-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 4px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
    }
    .ma-item:active { background: #eaf3fc; border-color: var(--accent); }

    /* Trang xem ảnh của 1 mã */
    .gallery-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .back-btn {
      border: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }
    .gallery-title { font-size: 17px; font-weight: 700; }

    .img-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .img-grid img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #eee;
    }

    /* Lightbox xem ảnh to */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .lightbox.show { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 6px;
    }

    .empty, .loading {
      text-align: center;
      color: var(--muted);
      padding: 40px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header id="pageTitle">Catalog Sản Phẩm</header>

  <main id="mainContent">
    <div class="loading">Đang tải dữ liệu...</div>
  </main>

  <nav class="tabs" id="tabBar"></nav>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    /**
     * Trạng thái ứng dụng: dữ liệu catalog, tab đang chọn, mã đang xem.
     */
    let catalog = { categories: [], data: {} };
    let currentTab = null;
    let currentMa = null;

    /**
     * URL Web App của Google Apps Script (Deploy > New deployment > Web app).
     * Thay bằng URL thật sau khi deploy.
     */
    const API_URL = 'DÁN_URL_WEB_APP_CỦA_BẠN_VÀO_ĐÂY';

    /**
     * Tải dữ liệu từ server (Google Sheet qua Apps Script Web App) khi mở trang.
     */
    function loadCatalog() {
      fetch(API_URL)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(onCatalogLoaded)
        .catch(onCatalogError);
    }

    /**
     * Xử lý khi tải dữ liệu thành công: dựng thanh tab và hiển thị tab đầu tiên.
     * @param {{categories: string[], data: Object}} result - Dữ liệu từ backend.
     */
    function onCatalogLoaded(result) {
      catalog = result;
      renderTabs();
      if (catalog.categories.length > 0) {
        selectTab(catalog.categories[0]);
      } else {
        document.getElementById('mainContent').innerHTML =
          '<div class="empty">Chưa có dữ liệu. Vui lòng thêm dữ liệu vào Google Sheet.</div>';
      }
    }

    /**
     * Hiển thị thông báo lỗi khi không tải được dữ liệu.
     * @param {Error} err - Lỗi trả về từ Apps Script.
     */
    function onCatalogError(err) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty">Lỗi tải dữ liệu: ' + escapeHtml(err.message) + '</div>';
    }

    /**
     * Dựng thanh tab dưới cùng dựa trên danh sách loại sản phẩm có dữ liệu.
     */
    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = '';
      catalog.categories.forEach(function (cat) {
        const btn = document.createElement('button');
        btn.textContent = cat;
        btn.onclick = function () { selectTab(cat); };
        tabBar.appendChild(btn);
      });
    }

    /**
     * Chuyển sang tab được chọn, hiển thị danh sách mã của tab đó.
     * @param {string} tab - Tên loại sản phẩm (Bộ vest / Quần / Áo sơ mi).
     */
    function selectTab(tab) {
      currentTab = tab;
      currentMa = null;
      document.getElementById('pageTitle').textContent = tab;

      const buttons = document.querySelectorAll('nav.tabs button');
      buttons.forEach(function (b) {
        b.classList.toggle('active', b.textContent === tab);
      });

      renderMaList();
    }

    /**
     * Hiển thị lưới danh sách mã sản phẩm thuộc tab hiện tại.
     */
    function renderMaList() {
      const maMap = catalog.data[currentTab] || {};
      const codes = Object.keys(maMap);
      const main = document.getElementById('mainContent');

      if (codes.length === 0) {
        main.innerHTML = '<div class="empty">Chưa có mã nào trong mục này.</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'ma-grid';
      codes.forEach(function (ma) {
        const item = document.createElement('div');
        item.className = 'ma-item';
        item.textContent = 'Mã ' + ma;
        item.onclick = function () { openGallery(ma); };
        grid.appendChild(item);
      });

      main.innerHTML = '';
      main.appendChild(grid);
    }

    /**
     * Mở trang xem ảnh của một mã sản phẩm cụ thể.
     * @param {string} ma - Mã sản phẩm cần xem ảnh.
     */
    function openGallery(ma) {
      currentMa = ma;
      const images = (catalog.data[currentTab] && catalog.data[currentTab][ma]) || [];
      document.getElementById('pageTitle').textContent = currentTab + ' - Mã ' + ma;

      const main = document.getElementById('mainContent');
      main.innerHTML = '';

      const header = document.createElement('div');
      header.className = 'gallery-header';
      const backBtn = document.createElement('button');
      backBtn.className = 'back-btn';
      backBtn.textContent = '← Quay lại';
      backBtn.onclick = function () {
        document.getElementById('pageTitle').textContent = currentTab;
        renderMaList();
      };
      header.appendChild(backBtn);
      const title = document.createElement('div');
      title.className = 'gallery-title';
      title.textContent = 'Mã ' + ma + ' (' + images.length + ' ảnh)';
      header.appendChild(title);
      main.appendChild(header);

      if (images.length === 0) {
        main.innerHTML += '<div class="empty">Mã này chưa có ảnh.</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'img-grid';
      images.forEach(function (url) {
        const img = document.createElement('img');
        img.src = url;
        img.loading = 'lazy';
        img.alt = 'Mã ' + ma;
        img.onclick = function () { openLightbox(url); };
        grid.appendChild(img);
      });
      main.appendChild(grid);
    }

    /**
     * Mở ảnh phóng to toàn màn hình.
     * @param {string} url - Link ảnh cần xem to.
     */
    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('show');
    }

    /**
     * Thoát chế độ xem ảnh phóng to khi bấm ra ngoài.
     */
    document.getElementById('lightbox').onclick = function () {
      this.classList.remove('show');
    };

    /**
     * Chống lỗi hiển thị (XSS) khi in thông báo lỗi ra trang.
     * @param {string} str - Chuỗi cần escape.
     * @return {string} Chuỗi an toàn để chèn vào HTML.
     */
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadCatalog();
  </script>
</body>
</html>
