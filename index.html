<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Catalog Sản Phẩm</title>
<style>
  :root {
    --primary: #2c3e50;
    --accent: #3498db;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --border: #e1e5e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 70px;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  nav.tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: #fff;
    border-top: 1px solid var(--border);
    z-index: 30;
  }
  nav.tabs button {
    flex: 1;
    border: none;
    background: none;
    padding: 12px 4px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  nav.tabs button.active {
    color: var(--accent);
    border-top: 3px solid var(--accent);
  }
  main { padding: 12px; }
  .ma-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .ma-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 4px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
  }
  .ma-item:active { background: #eaf3fc; border-color: var(--accent); }
  .gallery-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .back-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
  }
  .gallery-title { font-size: 17px; font-weight: 700; }
  .img-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .img-grid img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #eee;
  }
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 6px;
  }
  .empty, .loading {
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header id="pageTitle">Catalog Sản Phẩm</header>

<main id="mainContent">
  <div class="loading">Đang tải dữ liệu...</div>
</main>

<nav class="tabs" id="tabBar"></nav>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
  /* ============================================================
   * CẤU HÌNH - THAY LINK NÀY BẰNG LINK CSV CỦA GOOGLE SHEET
   * Cách lấy: Google Sheet -> Tệp -> Chia sẻ -> Xuất bản lên web
   * -> chọn sheet "DuLieu" -> định dạng CSV -> Xuất bản -> copy link.
   * ============================================================ */
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR23d2UNTuVBhYAT87ddAfqlyFIpRT1gSdRj5Wleq4rrBnqh7w-gzWi62Wz3S9vxuKEvXIdDZFS6Pee/pub?gid=0&single=true&output=csv';

  // Thứ tự tab cố định hiển thị
  const CATEGORY_ORDER = ['Bộ vest', 'Quần', 'Áo sơ mi'];

  let catalog = { categories: [], data: {} };
  let currentTab = null;

  /**
   * Tải và parse dữ liệu CSV từ Google Sheet khi mở trang.
   */
  async function loadCatalog() {
    try {
      const res = await fetch(CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Không tải được dữ liệu (HTTP ' + res.status + ')');
      const text = await res.text();
      const rows = parseCsv(text);
      buildCatalog(rows);
      renderTabs();
      if (catalog.categories.length > 0) {
        selectTab(catalog.categories[0]);
      } else {
        document.getElementById('mainContent').innerHTML =
          '<div class="empty">Chưa có dữ liệu. Vui lòng thêm dữ liệu vào Google Sheet.</div>';
      }
    } catch (err) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty">Lỗi tải dữ liệu: ' + escapeHtml(err.message) +
        '<br><br>Kiểm tra lại: đã publish Sheet ra CSV và dán đúng link chưa?</div>';
    }
  }

  /**
   * Parse chuỗi CSV thành mảng các dòng (mỗi dòng là mảng cột),
   * có xử lý trường hợp giá trị chứa dấu phẩy nằm trong dấu ngoặc kép.
   * @param {string} text - Nội dung CSV thô.
   * @return {string[][]} Mảng 2 chiều: hàng x cột.
   */
  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\r') { /* bỏ qua */ }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (v) { return v.trim() !== ''; }); });
  }

  /**
   * Xây dữ liệu catalog (nhóm theo Loại > Mã > danh sách ảnh) từ dữ liệu CSV thô.
   * Giả định cột theo thứ tự: Loai, Ma, ImageURL (dòng đầu là tiêu đề, bị bỏ qua).
   * @param {string[][]} rows - Dữ liệu CSV đã parse.
   */
  function buildCatalog(rows) {
    const data = {};
    // Bỏ dòng tiêu đề (dòng đầu tiên)
    for (let i = 1; i < rows.length; i++) {
      const loai = (rows[i][0] || '').trim();
      const ma = (rows[i][1] || '').trim();
      const url = (rows[i][2] || '').trim();
      if (!loai || !ma || !url) continue;

      if (!data[loai]) data[loai] = {};
      if (!data[loai][ma]) data[loai][ma] = [];
      data[loai][ma].push(convertDriveUrl(url));
    }
    const categories = CATEGORY_ORDER.filter(function (c) { return !!data[c]; });
    catalog = { categories: categories, data: data };
  }

  /**
   * Chuyển link chia sẻ Google Drive thành link ảnh hiển thị trực tiếp
   * được trong thẻ <img>. Link không phải Drive thì giữ nguyên.
   * @param {string} url - Link gốc trong Sheet.
   * @return {string} Link ảnh dùng được trực tiếp.
   */
  function convertDriveUrl(url) {
    const patterns = [/\/d\/([a-zA-Z0-9_-]{20,})/, /id=([a-zA-Z0-9_-]{20,})/];
    for (let i = 0; i < patterns.length; i++) {
      const match = url.match(patterns[i]);
      if (match && match[1]) {
        return 'https://lh3.googleusercontent.com/d/' + match[1] + '=w1000';
      }
    }
    return url;
  }

  /**
   * Dựng thanh tab dưới cùng theo danh sách loại sản phẩm có dữ liệu.
   */
  function renderTabs() {
    const tabBar = document.getElementById('tabBar');
    tabBar.innerHTML = '';
    catalog.categories.forEach(function (cat) {
      const btn = document.createElement('button');
      btn.textContent = cat;
      btn.onclick = function () { selectTab(cat); };
      tabBar.appendChild(btn);
    });
  }

  /**
   * Chuyển sang tab được chọn và hiển thị danh sách mã của tab đó.
   * @param {string} tab - Tên loại sản phẩm.
   */
  function selectTab(tab) {
    currentTab = tab;
    document.getElementById('pageTitle').textContent = tab;
    document.querySelectorAll('nav.tabs button').forEach(function (b) {
      b.classList.toggle('active', b.textContent === tab);
    });
    renderMaList();
  }

  /**
   * Hiển thị lưới danh sách mã sản phẩm thuộc tab hiện tại.
   */
  function renderMaList() {
    const maMap = catalog.data[currentTab] || {};
    const codes = Object.keys(maMap);
    const main = document.getElementById('mainContent');

    if (codes.length === 0) {
      main.innerHTML = '<div class="empty">Chưa có mã nào trong mục này.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'ma-grid';
    codes.forEach(function (ma) {
      const item = document.createElement('div');
      item.className = 'ma-item';
      item.textContent = 'Mã ' + ma;
      item.onclick = function () { openGallery(ma); };
      grid.appendChild(item);
    });

    main.innerHTML = '';
    main.appendChild(grid);
  }

  /**
   * Mở trang xem ảnh của một mã sản phẩm cụ thể.
   * @param {string} ma - Mã sản phẩm cần xem ảnh.
   */
  function openGallery(ma) {
    const images = (catalog.data[currentTab] && catalog.data[currentTab][ma]) || [];
    document.getElementById('pageTitle').textContent = currentTab + ' - Mã ' + ma;

    const main = document.getElementById('mainContent');
    main.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'gallery-header';
    const backBtn = document.createElement('button');
    backBtn.className = 'back-btn';
    backBtn.textContent = '← Quay lại';
    backBtn.onclick = function () {
      document.getElementById('pageTitle').textContent = currentTab;
      renderMaList();
    };
    header.appendChild(backBtn);
    const title = document.createElement('div');
    title.className = 'gallery-title';
    title.textContent = 'Mã ' + ma + ' (' + images.length + ' ảnh)';
    header.appendChild(title);
    main.appendChild(header);

    if (images.length === 0) {
      main.innerHTML += '<div class="empty">Mã này chưa có ảnh.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'img-grid';
    images.forEach(function (url) {
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.alt = 'Mã ' + ma;
      img.onclick = function () { openLightbox(url); };
      grid.appendChild(img);
    });
    main.appendChild(grid);
  }

  /**
   * Mở ảnh phóng to toàn màn hình.
   * @param {string} url - Link ảnh cần xem to.
   */
  function openLightbox(url) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightbox').classList.add('show');
  }

  document.getElementById('lightbox').onclick = function () {
    this.classList.remove('show');
  };

  /**
   * Chống lỗi hiển thị khi in thông báo lỗi ra trang.
   * @param {string} str - Chuỗi cần escape.
   * @return {string} Chuỗi an toàn để chèn vào HTML.
   */
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadCatalog();
</script>
</body>
</html>
